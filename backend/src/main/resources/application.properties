spring.application.name=coccia-house-api

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the database structure.
spring.jpa.hibernate.ddl-auto=validate

# Prevent database access from leaking into the web-response layer.
spring.jpa.open-in-view=false

# Run database migrations when the application starts.
spring.flyway.enabled=true

# Helpful during local development.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true