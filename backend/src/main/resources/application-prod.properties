# Production logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Session cookie security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10h
spring.session.jdbc.initialize-schema=never

# Respect proxy headers from the production hosting platform.
server.forward-headers-strategy=framework

# Railway serverless may wake the API before PostgreSQL is ready.
# Give the database time to become available during application startup.
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.connection-timeout=5000

# Railway/PostgreSQL may close long-lived idle connections.
# Retire pooled connections proactively and periodically validate idle ones.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# Keep the PostgreSQL TCP connection alive at the driver level.
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
